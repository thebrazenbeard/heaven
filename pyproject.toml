[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heaven-storage"
version = "0.1.0"
description = "A capacity-aware federated storage pool with a single virtual namespace"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
heaven = "heaven.cli:main"

[tool.setuptools.packages.find]
include = ["heaven*"]

