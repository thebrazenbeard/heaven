[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heaven-storage"
version = "0.1.0"
description = "Provider-neutral chunked storage pool prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
heaven = "heaven.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
